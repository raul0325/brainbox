<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BrainBox">
<meta name="theme-color" content="#FAFAFB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BrainBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="light"></div>

<div id="splash">
  <p id="splashTitle">BrainBox</p>
  <p id="splashTagline">必要なときに。</p>
</div>

<main id="app">
  <div id="bottom">
    <button id="dateChip" hidden></button>

    <div id="capture">
      <textarea id="input" placeholder="思いついたことを、そのまま。" rows="1"></textarea>
      <div id="captureControls">
        <div id="calendarWrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3.5" y="5" width="17" height="15" rx="2.5"/>
            <path d="M3.5 9.5h17M8 3v3M16 3v3"/>
          </svg>
          <input type="date" id="dateInput" aria-label="日付を選ぶ">
        </div>
        <button id="submit" aria-label="預ける">預ける</button>
      </div>
    </div>

    <div id="dots" aria-hidden="true">⋮</div>

    <button id="pocket">手もとに</button>

    <p id="micHint">キーボードの🎤で話せます</p>
  </div>
</main>

<div id="sheetOverlay"></div>
<section id="pocketSheet" aria-hidden="true">
  <div id="sheetHandle"></div>
  <div id="pullIndicator" aria-hidden="true"><span></span></div>
  <div id="pocketBody">
    <ul id="pocketList"></ul>
    <p id="pocketEmpty">まだ何もありません</p>
  </div>
  <button id="undoToast" hidden>元に戻す</button>
</section>

<script src="app.js"></script>
</body>
</html>
