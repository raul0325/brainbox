<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BrainBox">
<meta name="theme-color" content="#FAFAFB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BrainBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="light"></div>

<main id="app">
  <div id="capture">
    <textarea id="input" placeholder="思いついたことを、そのまま。" rows="1"></textarea>
    <button id="mic" aria-label="音声で話す">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="submit" aria-label="預ける">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

  <button id="summary" aria-expanded="false"></button>

  <section id="today" hidden>
    <ul id="todayList"></ul>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
