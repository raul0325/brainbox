<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BrainBox">
<meta name="theme-color" content="#FAFAFB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BrainBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="light"></div>

<div id="splash">
  <p id="splashTitle">BrainBox</p>
  <p id="splashTagline">必要なときに。</p>
</div>

<main id="app">
  <div id="capture">
    <textarea id="input" placeholder="思いついたことを、そのまま。" rows="1"></textarea>
    <button id="submit" aria-label="預ける">預ける</button>
  </div>
  <p id="micHint">キーボードの🎤で話せます</p>

  <button id="summary" aria-expanded="false"></button>

  <section id="today" hidden>
    <ul id="todayList"></ul>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
